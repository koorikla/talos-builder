name: Build Talos RPi5 WiFi image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  USERNAME: ${{ github.repository }}
  SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  # Kernel and Talos images are tagged with a hash of patches/pkgs, so they are
  # rebuilt only when the patches or the Talos version change.
  kernel:
    name: Kernel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/dotnet
      - run: make checkouts patches
      - name: Build kernel
        run: |
          image=$(make -s tags | awk '$1 == "kernel:" {print $2}')
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image already exists, skipping"
          else
            make kernel
          fi

  talos:
    name: Talos installer-base + imager
    needs: kernel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/dotnet
      - run: make checkouts
      - name: Build installer-base and imager
        run: |
          image=$(make -s tags | awk '$1 == "imager:" {print $2}')
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image already exists, skipping"
          else
            make talos
          fi

  image:
    name: Extension, installer and disk image
    needs: talos
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: imjasonh/setup-crane@v0.7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make checkouts
      - run: make extension
      - run: make installer
      - run: make image
      - name: Summary
        run: |
          {
            echo '```'
            make -s tags
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: metal-arm64
          path: _out/metal-arm64.raw.zst
          retention-days: 14
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: _out/metal-arm64.raw.zst
